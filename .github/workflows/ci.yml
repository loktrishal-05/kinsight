name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,api]" pip-audit
      - run: ruff check services tests scripts
      - run: python scripts/license_inventory.py --check
      - run: python -m scripts.sync_language_badge --check
      - run: pytest -q
      - run: python scripts/demo.py
      - name: secret scan (simple)
        run: "! grep -rEn '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA )?PRIVATE KEY)' --exclude-dir=node_modules --exclude-dir=.git ."
      - name: Verify FHIR R4 seed on HAPI
        timeout-minutes: 6
        env:
          KINSIGHT_FHIR_TEST_URL: http://127.0.0.1:8088/fhir
        run: |
          cp .env.example .env
          docker compose up -d fhir
          if ! curl --retry 35 --retry-all-errors --retry-delay 3 --retry-max-time 150 --max-time 5 --fail --silent "$KINSIGHT_FHIR_TEST_URL/metadata" > /dev/null; then
            docker compose logs --tail 80 fhir
            exit 1
          fi
          make fhir-seed FHIR_URL="$KINSIGHT_FHIR_TEST_URL"
          pytest -q tests/integration/test_fhir_seed.py
      - run: pip-audit || true   # report only; tighten once the baseline is clean
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
