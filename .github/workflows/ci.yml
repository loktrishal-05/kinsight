name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,api]" pip-audit
      - run: ruff check services tests scripts
      - run: pytest -q
      - run: python scripts/demo.py
      - name: secret scan (simple)
        run: "! grep -rEn '(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA )?PRIVATE KEY)' --exclude-dir=node_modules --exclude-dir=.git ."
      - run: pip-audit || true   # report only; tighten once the baseline is clean
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
