name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - run: pip install --upgrade "setuptools>=84.1" && pip install -e ".[dev,api]" pip-audit
      - run: ruff check services tests scripts
      - run: python scripts/license_inventory.py --check
      - run: python -m scripts.sync_language_badge --check
      - run: pytest -q --cov=services/genetics --cov=services/consent --cov-report=term --cov-report=xml --cov-fail-under=92
      - run: python scripts/demo.py
      - name: secret scan (gitleaks, pinned by checksum)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --no-banner --redact --config .gitleaks.toml
          rm -f gitleaks gitleaks.tgz
      - name: Verify FHIR R4 seed on HAPI
        timeout-minutes: 6
        env:
          KINSIGHT_FHIR_TEST_URL: http://127.0.0.1:8088/fhir
        run: |
          cp .env.example .env
          docker compose up -d fhir
          if ! curl --retry 35 --retry-all-errors --retry-delay 3 --retry-max-time 150 --max-time 5 --fail --silent "$KINSIGHT_FHIR_TEST_URL/metadata" > /dev/null; then
            docker compose logs --tail 80 fhir
            exit 1
          fi
          make fhir-seed FHIR_URL="$KINSIGHT_FHIR_TEST_URL"
          pytest -q tests/integration/test_fhir_seed.py tests/integration/test_fhir_referral.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Exercise the synthetic FHIR and signed lab integrations in Chromium
        timeout-minutes: 10
        env:
          KINSIGHT_DEMO: "1"
          KINSIGHT_DEMO_AUTH: "1"
          KINSIGHT_TOKEN_SECRET: local-ci-auth-secret-for-synthetic-browser-tests
          KINSIGHT_AUDIT_SALT: local-ci-audit-salt-for-synthetic-browser-tests
          KINSIGHT_LAB_SANDBOX: "1"
          KINSIGHT_LAB_SIGNING_SECRET: local-ci-lab-signing-key-for-synthetic-browser-tests
          KINSIGHT_FHIR_SANDBOX_URL: http://127.0.0.1:8088/fhir
          KINSIGHT_FHIR_REFERRAL_URL: http://127.0.0.1:8088/fhir
          DATABASE_URL: sqlite:///kinsight-integration.db
          KINSIGHT_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_FHIR_SANDBOX: "1"
          NEXT_PUBLIC_LAB_SANDBOX: "1"
          NEXT_PUBLIC_FHIR_REFERRAL: "1"
        run: |
          python -m uvicorn services.api.main:app --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:8000/api/health
          cd web
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.live.config.ts fhir-preview.spec.ts lab-sandbox.spec.ts fhir-referral.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-integration-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - run: pip-audit --skip-editable   # fails the build on any known vulnerability
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
