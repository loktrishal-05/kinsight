# Free-plan Render services sleep after ~15 minutes idle. A light ping every 10 minutes keeps the demo API warm.
# Public repo: scheduled workflows are free. GitHub pauses them after 60 days without repo activity.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://kinsight-api-fcp7.onrender.com/api/health
