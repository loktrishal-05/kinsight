# One command: docker compose up. Synthetic data only; secrets come from .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: kinsight, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kinsight-demo}", POSTGRES_DB: kinsight }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  fhir:
    image: hapiproject/hapi:v8.10.0-2@sha256:c5e53fb34bf39958c336837795f504673103f212e179ced14c8f7b96b585a182
    profiles: [fhir]
    environment:
      HAPI_FHIR_VERSION: R4
    ports: ["127.0.0.1:8088:8080"]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+psycopg://kinsight:${POSTGRES_PASSWORD:-kinsight-demo}@postgres/kinsight" }
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_MOCK: "${NEXT_PUBLIC_MOCK:-1}"
        NEXT_PUBLIC_FHIR_SANDBOX: "${NEXT_PUBLIC_FHIR_SANDBOX:-0}"
        NEXT_PUBLIC_FHIR_REFERRAL: "${NEXT_PUBLIC_FHIR_REFERRAL:-0}"
        NEXT_PUBLIC_LAB_SANDBOX: "${NEXT_PUBLIC_LAB_SANDBOX:-0}"
        NEXT_PUBLIC_KIN_TOOLS: "${NEXT_PUBLIC_KIN_TOOLS:-0}"
        KINSIGHT_API_URL: "http://api:8000"
    environment: { KINSIGHT_API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
