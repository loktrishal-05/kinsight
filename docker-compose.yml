# One command: docker compose up. Synthetic data only; secrets come from .env (see .env.example).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: kinsight, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-kinsight-demo}", POSTGRES_DB: kinsight }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+psycopg://kinsight:${POSTGRES_PASSWORD:-kinsight-demo}@postgres/kinsight" }
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  web:
    build: { context: web, args: { NEXT_PUBLIC_MOCK: "${NEXT_PUBLIC_MOCK:-1}" } }
    environment: { KINSIGHT_API_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
