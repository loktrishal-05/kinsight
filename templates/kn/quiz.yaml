q_carrier_not_disease:
  text: "ಕಾಯಿಲೆಯ ವಾಹಕರಾಗಿರುವುದು ಎಂದರೆ ಆ ವ್ಯಕ್ತಿಗೆ ಕಾಯಿಲೆ ಇದೆ ಎಂದರ್ಥವೇ?"
  options:
    - "ಇಲ್ಲ, ಕಾಯಿಲೆಯ ವಾಹಕರಾಗಿರುವುದು ಮತ್ತು ಕಾಯಿಲೆ ಇರುವುದು ಒಂದೇ ಅಲ್ಲ"
    - "ಹೌದು, ಯಾವಾಗಲೂ"
q_chance_not_certain:
  text: "ಮಗುವಿಗೆ ಕಾಯಿಲೆ ಇರುವ ಸಾಧ್ಯತೆಯನ್ನು ತೋರಿಸಿದರೆ, ಮಗುವಿಗೆ ಖಂಡಿತವಾಗಿಯೂ ಕಾಯಿಲೆ ಇರುತ್ತದೆ ಎಂದರ್ಥವೇ?"
  options:
    - "ಇಲ್ಲ, ಇದು ಸಾಧ್ಯತೆ ಮಾತ್ರ, ಖಚಿತವಲ್ಲ"
    - "ಹೌದು, ಹಾಗೆಯೇ ಆಗುತ್ತದೆ"
q_who_decides:
  text: "ಮುಂದೆ ಏನು ಮಾಡಬೇಕೆಂದು ಯಾರು ನಿರ್ಧರಿಸುತ್ತಾರೆ?"
  options:
    - "ನೀವೇ ನಿರ್ಧರಿಸುತ್ತೀರಿ, ನಿಮಗೆ ಬೇಕಿದ್ದರೆ ನೆರವು ಪಡೆಯಬಹುದು"
    - "ಸಲಹೆಗಾರರು ನಿಮ್ಮ ಪರವಾಗಿ ನಿರ್ಧರಿಸುತ್ತಾರೆ"
    - "ನಿಮ್ಮ ಕುಟುಂಬದವರು ನಿಮ್ಮ ಪರವಾಗಿ ನಿರ್ಧರಿಸುತ್ತಾರೆ"
q_counsellor_anytime:
  text: "ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ವಂಶವಾಹಿ ಕಾಯಿಲೆಗಳ ಬಗ್ಗೆ ಸಲಹೆ ನೀಡುವವರ ಜೊತೆ ಮಾತನಾಡಲು ಕೇಳಬಹುದೇ?"
  options:
    - "ಹೌದು"
    - "ಇಲ್ಲ, ಒಮ್ಮೆ ಮಾತ್ರ"
q_estimate_not_diagnosis:
  text: "ಕಾಯಿಲೆ ಇರುವ ಸಾಧ್ಯತೆಯ ಅಂದಾಜು ಮತ್ತು ಕಾಯಿಲೆ ಇದೆಯೇ ಎಂದು ಪತ್ತೆ ಮಾಡುವುದು ಒಂದೇ ಆಗಿದೆಯೇ?"
  options:
    - "ಇಲ್ಲ, ಅಂದಾಜು ಮಾಡುವುದು ಕಾಯಿಲೆ ಇದೆಯೇ ಎಂದು ಪತ್ತೆ ಮಾಡುವುದಲ್ಲ"
    - "ಹೌದು, ಎರಡೂ ಒಂದೇ"
q_chance_value:
  text: "ಪ್ರತಿ ಗರ್ಭಧಾರಣೆಯಲ್ಲೂ ಮಗುವಿಗೆ ಕಾಯಿಲೆ ಇರುವ ಸಾಧ್ಯತೆ ಎಷ್ಟು ಎಂದು ನಿಮ್ಮ ಫಲಿತಾಂಶ ತೋರಿಸುತ್ತದೆ?"
  options: []
