q_carrier_not_disease:
  text: "ஒருவர் நோயை ஏற்படுத்தக்கூடிய மரபணு மாற்றத்தைக் கொண்டிருப்பவர் (கேரியர்) என்றால், அவருக்கு அந்த நோய் இருக்கிறது என்று அர்த்தமா?"
  options:
    - "இல்லை, கேரியராக இருப்பதும் அந்த நோய் இருப்பதும் ஒன்றல்ல"
    - "ஆம், எப்போதும் அப்படித்தான்"
q_chance_not_certain:
  text: "குழந்தைக்கு பாதிப்பு ஏற்படும் வாய்ப்பு இருப்பதாகக் காட்டினால், குழந்தைக்கு உறுதியாகப் பாதிப்பு ஏற்படும் என்று அர்த்தமா?"
  options:
    - "இல்லை, இது ஒரு வாய்ப்புதான், உறுதி அல்ல"
    - "ஆம், அது நடக்கும்"
q_who_decides:
  text: "அடுத்து என்ன செய்வது என்று யார் முடிவு செய்வது?"
  options:
    - "நீங்கள் முடிவு செய்வீர்கள்; நீங்கள் விரும்பினால் உதவி பெறலாம்"
    - "உங்களுக்காக ஆலோசகர் முடிவு செய்வார்"
    - "உங்களுக்காக உங்கள் குடும்பத்தினர் முடிவு செய்வார்கள்"
q_counsellor_anytime:
  text: "மரபணு ஆலோசகருடன் பேச வேண்டும் என்று எந்த நேரத்திலும் கேட்கலாமா?"
  options:
    - "ஆம்"
    - "இல்லை, ஒரு முறை மட்டுமே கேட்கலாம்"
q_estimate_not_diagnosis:
  text: "நோய் ஏற்படும் வாய்ப்பை மதிப்பிடுவதும், நோய் இருப்பதை உறுதி செய்வதும் ஒன்றா?"
  options:
    - "இல்லை, வாய்ப்பை மதிப்பிடுவது நோய் இருப்பதை உறுதி செய்வது அல்ல"
    - "ஆம், இரண்டும் ஒன்றுதான்"
q_chance_value:
  text: "ஒவ்வொரு கர்ப்பத்திலும் குழந்தைக்கு பாதிப்பு ஏற்படும் வாய்ப்பு எவ்வளவு என்று உங்கள் பரிசோதனை முடிவு காட்டுகிறது?"
  options: []
