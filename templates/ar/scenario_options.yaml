# أوصاف مراجَعة ومحايدة لما يتغيّر في كل مسار. ترتيب ثابت ووزن متساوٍ دون نصائح أو أرقام.
options:
  - id: natural_conception
    title: الحمل دون فحوص إضافية
    changes: تبقى الفرصة لكل حمل كما حُسبت أعلاه. ويمكن فحص الحمل لاحقا إذا اختارت العائلة ذلك.
  - id: prenatal_diagnosis
    title: الفحص أثناء الحمل
    changes: تحل نتيجة فحص لذلك الحمل محل الفرصة المحسوبة. وللفحوص مدد زمنية ومخاطر صغيرة خاصة بها يشرحها المستشار.
  - id: pgt_m
    title: فحص الأجنة قبل نقلها (PGT-M)
    changes: تُفحص الأجنة بحثا عن التغيّر المحدد قبل نقل أحدها. ويتضمن ذلك علاجا للخصوبة وتكلفة ووقتا للانتظار، ولا يوجد فحص مثالي.
  - id: donor_gametes
    title: بويضة أو حيوان منوي من متبرع
    changes: تعتمد الفرصة على فحص المتبرع بدلا من نتائج الزوجين. كما يتغير من تربطه صلة وراثية بالطفل.
  - id: adoption
    title: التبني أو الكفالة
    changes: لا تنطبق الفرصة الوراثية المذكورة هنا لأن هذين الزوجين لا ينقلان جينات.
