# بنك الأسئلة المراجَع لورقة التحضير قبل الاستشارة. صياغة محايدة: أسئلة فقط دون نصائح أو توصيات بشأن الزواج أو الإنجاب.
concerns:
  family_reaction: كيف قد تتفاعل عائلتي
  future_children: خططي للأطفال في المستقبل
  cost: تكلفة الفحوص والزيارات
  religion: الدين والمعتقدات
  privacy: من يستطيع رؤية معلوماتي
general:
  - ماذا تعني نتيجتي بكلمات بسيطة؟
  - ماذا يستطيع هذا الفحص أن يكشف وماذا لا يستطيع؟
  - ما الخيارات المتاحة لي وماذا يتضمن كل خيار؟
stage:
  premarital:
    - كيف تبدو النتائج لزوجين تربطهما قرابة؟
    - ما الفحوص التي يمكننا النظر فيها قبل اتخاذ أي قرار معا؟
  preconception:
    - ما الخيارات المتاحة لنا قبل الحمل؟
    - متى يمكن إجراء الفحص أثناء الحمل إذا اخترنا ذلك؟
  pregnant:
    - ما المدد الزمنية المتاحة للفحوص المطروحة أمامنا؟
    - ماذا يتضمن كل فحص بالنسبة لي وللجنين؟
tier:
  1:
    - هل تعني نتيجة لم يُعثر فيها على تغيير استبعاد كل الحالات الوراثية؟
  2:
    - ما الأجزاء غير المؤكدة في نتيجتي وكيف يمكن تأكيدها؟
  3:
    - ما الفحوص التي يمكنها تأكيد ما وُجد وكم تستغرق؟
    - كيف تُحسب الفرصة لكل حمل في عائلتنا؟
concern:
  family_reaction:
    - كيف تتحدث العائلات الأخرى عن هذا الموضوع مع أقاربها؟
    - هل يمكن لأحد أفراد العائلة حضور الجلسة إذا رغبت؟
  future_children:
    - كيف توصف الفرصة لطفل في المستقبل بالأرقام وبالكلمات؟
    - ما الخيارات المتاحة إذا رغبنا في إنجاب أطفال؟
  cost:
    - كم يكلف كل فحص أو زيارة وما الدعم المتاح؟
    - أي الزيارات يمكن إجراؤها عن بعد؟
  religion:
    - كيف نظر آخرون إلى معتقداتهم إلى جانب هذه المعلومات؟
    - هل يمكن للمستشار التحدث مع شخص أثق به من مجتمعي؟
  privacy:
    - من يستطيع رؤية نتيجتي وكيف أغيّر ذلك؟
    - ماذا يحدث لملاحظات جلستنا؟
bring:
  report: تقرير الفحص الخاص بي
  id: وثيقة هوية
  partner: شريكي إذا رغب في الحضور
  family_history: ملاحظات عن أقارب لديهم حالات وراثية
