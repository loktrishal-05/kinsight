q_carrier_not_disease:
  text: "രോഗവാഹകൻ (കാരിയർ) ആയ ഒരാൾക്ക് ആ രോഗം ഉണ്ടെന്നാണോ അർഥം?"
  options:
    - "അല്ല, രോഗവാഹകനായിരിക്കുന്നതും രോഗം ഉള്ളതും ഒരുപോലെയല്ല"
    - "അതെ, എപ്പോഴും"
q_chance_not_certain:
  text: "കുഞ്ഞിന് രോഗം ഉണ്ടാകാൻ സാധ്യതയുണ്ടെന്ന് കാണിച്ചാൽ, കുഞ്ഞിന് തീർച്ചയായും രോഗം ഉണ്ടാകും എന്നാണോ അർഥം?"
  options:
    - "അല്ല, അത് ഒരു സാധ്യതയാണ്, ഉറപ്പല്ല"
    - "അതെ, അത് സംഭവിക്കും"
q_who_decides:
  text: "ഇനി എന്ത് ചെയ്യണമെന്ന് ആരാണ് തീരുമാനിക്കുന്നത്?"
  options:
    - "നിങ്ങളാണ് തീരുമാനിക്കുന്നത്, വേണമെങ്കിൽ സഹായം സ്വീകരിക്കാം"
    - "നിങ്ങൾക്കുവേണ്ടി കൗൺസിലർ തീരുമാനിക്കും"
    - "നിങ്ങൾക്കുവേണ്ടി നിങ്ങളുടെ കുടുംബം തീരുമാനിക്കും"
q_counsellor_anytime:
  text: "ഏത് സമയത്തും ഒരു ജനിതക കൗൺസിലറുമായി സംസാരിക്കാൻ ആവശ്യപ്പെടാമോ?"
  options:
    - "അതെ"
    - "ഇല്ല, ഒരു തവണ മാത്രം"
q_estimate_not_diagnosis:
  text: "രോഗം ഉണ്ടാകാനുള്ള സാധ്യത കണക്കാക്കുന്നതും രോഗം ഉണ്ടെന്ന് കണ്ടെത്തുന്നതും ഒരുപോലെയാണോ?"
  options:
    - "അല്ല, സാധ്യത കണക്കാക്കുന്നത് രോഗം ഉണ്ടെന്ന് കണ്ടെത്തുന്നതല്ല"
    - "അതെ, രണ്ടും ഒന്നുതന്നെയാണ്"
q_chance_value:
  text: "ഓരോ ഗർഭധാരണത്തിലും കുഞ്ഞിന് രോഗം ഉണ്ടാകാൻ എത്ര സാധ്യതയുണ്ടെന്നാണ് നിങ്ങളുടെ ഫലം കാണിക്കുന്നത്?"
  options: []
