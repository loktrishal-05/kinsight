text: നിങ്ങളിൽ ഒരാൾ {condition_label} എന്ന അവസ്ഥയുമായി ബന്ധപ്പെട്ട ജീൻ മാറ്റം വഹിക്കുന്നയാളാണ്. മറ്റേയാളിൽ മാറ്റം കണ്ടെത്തിയില്ലെങ്കിലും ഒരു പരിശോധനയ്ക്കും എല്ലാ മാറ്റങ്ങളും കണ്ടെത്താനാവില്ല. ഇതും കണക്കിലെടുക്കുമ്പോൾ, ഓരോ ഗർഭത്തിലും കുഞ്ഞിന് ഈ അവസ്ഥ ഉണ്ടാകാനുള്ള സാധ്യത {risk_affected_pct} എന്നാണ് കണക്കാക്കുന്നത്.
