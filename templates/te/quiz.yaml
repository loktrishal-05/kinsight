q_carrier_not_disease:
  text: "క్యారియర్‌గా ఉండటం అంటే ఆ వ్యక్తికి ఆ వ్యాధి ఉన్నట్లేనా?"
  options:
    - "కాదు, క్యారియర్‌గా ఉండటం, ఆ వ్యాధి ఉండటం రెండూ ఒకటి కావు"
    - "అవును, ఎప్పుడూ అంతే"
q_chance_not_certain:
  text: "పిల్లలకు ఆ వ్యాధి వచ్చే అవకాశం ఉందని చూపిస్తే, తప్పకుండా ఆ వ్యాధి వస్తుందని అర్థమా?"
  options:
    - "కాదు, అది ఒక అవకాశం మాత్రమే, ఖచ్చితంగా జరుగుతుందని కాదు"
    - "అవును, తప్పకుండా వస్తుంది"
q_who_decides:
  text: "తరువాత ఏం చేయాలో ఎవరు నిర్ణయిస్తారు?"
  options:
    - "మీరే నిర్ణయిస్తారు, మీకు కావాలంటే సహాయం తీసుకోవచ్చు"
    - "మీ బదులు సలహాదారు నిర్ణయిస్తారు"
    - "మీ బదులు మీ కుటుంబం నిర్ణయిస్తుంది"
q_counsellor_anytime:
  text: "జన్యు సలహాదారుతో మాట్లాడాలని మీరు ఎప్పుడైనా అడగవచ్చా?"
  options:
    - "అవును"
    - "కాదు, ఒక్కసారి మాత్రమే"
q_estimate_not_diagnosis:
  text: "వ్యాధి వచ్చే అవకాశం ఎంత ఉందో అంచనా వేయడం, వ్యాధి ఉందని నిర్ధారించడం రెండూ ఒకటేనా?"
  options:
    - "కాదు, అంచనా వేయడం అంటే వ్యాధి ఉందని నిర్ధారించడం కాదు"
    - "అవును, రెండూ ఒకటే"
q_chance_value:
  text: "ప్రతి గర్భంలో పిల్లలకు ఆ వ్యాధి వచ్చే అవకాశం ఎంత ఉందని మీ ఫలితం చూపిస్తోంది?"
  options: []
