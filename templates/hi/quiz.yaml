q_carrier_not_disease:
  text: "क्या किसी बीमारी का वाहक (कैरियर) होने का मतलब है कि उस व्यक्ति को वह बीमारी है?"
  options:
    - "नहीं, वाहक होने और बीमारी होने का मतलब एक नहीं है"
    - "हाँ, हमेशा"
q_chance_not_certain:
  text: "अगर बच्चे को बीमारी होने की संभावना बताई गई है, तो क्या इसका मतलब है कि बच्चे को बीमारी ज़रूर होगी?"
  options:
    - "नहीं, यह संभावना है, पक्की बात नहीं"
    - "हाँ, ऐसा होगा"
q_who_decides:
  text: "आगे क्या करना है, यह कौन तय करता है?"
  options:
    - "आप तय करते हैं, और चाहें तो मदद ले सकते हैं"
    - "काउंसलर आपके लिए तय करता है"
    - "आपका परिवार आपके लिए तय करता है"
q_counsellor_anytime:
  text: "क्या आप किसी भी समय जेनेटिक काउंसलर से बात करने के लिए कह सकते हैं?"
  options:
    - "हाँ"
    - "नहीं, सिर्फ़ एक बार"
q_estimate_not_diagnosis:
  text: "क्या बीमारी होने की संभावना का अनुमान और बीमारी की पहचान (निदान) एक ही बात हैं?"
  options:
    - "नहीं, अनुमान का मतलब बीमारी की पहचान नहीं है"
    - "हाँ, दोनों एक ही बात हैं"
q_chance_value:
  text: "आपके नतीजे के अनुसार, हर गर्भावस्था में बच्चे को बीमारी होने की कितनी संभावना है?"
  options: []
