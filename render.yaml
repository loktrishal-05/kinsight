# Render Blueprint: the KinSight API (FastAPI, fictional demo data) plus a Postgres database.
# Secrets are generated by Render; nothing sensitive lives in this file.
databases:
  - name: kinsight-db
    databaseName: kinsight
    user: kinsight
    plan: free

services:
  - type: web
    name: kinsight-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kinsight-db, property: connectionString }
      - key: KINSIGHT_TOKEN_SECRET
        generateValue: true
      - key: KINSIGHT_AUDIT_SALT
        generateValue: true
      - key: KINSIGHT_DEMO
        value: "1"
      - key: KINSIGHT_DEMO_AUTH
        value: "1"
