# gitleaks config: the default rules, plus an allow-list for the fixed synthetic values the tests and examples use.
[extend]
useDefault = true

[allowlist]
description = "Synthetic test and example values, never real credentials"
paths = ['''^tests/''', '''^web/tests/''', '''^web/e2e/''', '''\.env\.example$''', '''^web/lib/fixtures/''', '''^data/''']
regexes = ['''synthetic[-_a-z0-9]*''', '''local-ci-[-a-z0-9]*''']
