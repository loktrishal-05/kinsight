[project]
name = "kinsight"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "httpx>=0.28.1", "fhir.resources>=8.3,<9"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2", "alembic>=1.13", "langgraph>=1.2.22", "langgraph-checkpoint-sqlite>=3.0", "psycopg[binary]>=3.1", "httpx>=0.28.1", "hl7>=0.4.5,<0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["services*"]
