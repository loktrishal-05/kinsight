[project]
name = "kinsight"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.14.3", "pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "hypothesis>=6.168.5", "ruff>=0.17.5", "httpx>=0.28.1", "fhir.resources>=8.3,<9", "mypy>=2.4.1", "types-PyYAML"]
api = ["fastapi>=0.162.5", "uvicorn>=0.54.0", "sqlalchemy>=2.0.58", "alembic>=1.20.1", "langgraph>=1.2.22", "langgraph-checkpoint-sqlite>=3.1.3", "psycopg[binary]>=3.3.9", "httpx>=0.28.1", "hl7>=0.4.5,<0.5", "fhir.resources>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C90", "N", "RUF"]
# E501: line length is the formatter's job (120). E701/E702: compact one-line guards are the house style.
# N818: exception names read as states (Unavailable, SourceUnavailable) and are part of the module APIs.
ignore = ["E501", "E701", "E702", "N818"]

[tool.ruff.lint.mccabe]
# Ratchet: the rule checkers (verify, case graph, consent decide, HL7 decode) sit at 16-21 today; lower as they are split.
max-complexity = 21

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "RUF001"]  # asserts, synthetic secrets, and non-Latin digits under test
# FastAPI dependency factories (`Depends(roles("person"))`) are evaluated once per route by design.
"services/api/**" = ["B008"]
# Route registries: complexity comes from the nested route definitions, each of which is simple on its own.
"services/api/{main,routes/lifecycle,routes/fhir_preview,routes/referral}.py" = ["C901"]
# The demo path and scripts are executable checks: assert is the point.
"services/api/demo/path.py" = ["S101"]
"scripts/**" = ["S101", "S311", "S603", "S607"]
# Seeded pseudo-random numbers for synthetic cohorts and simulations, never for secrets.
"services/{cohort/generate,api/demo/cases,analytics/capacity}.py" = ["S311"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.mypy]
# Strict where the numbers and the consent decisions live; the rest of the codebase follows as it is typed.
strict = true
files = ["services/genetics", "services/consent"]
