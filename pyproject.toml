[project]
name = "kinsight"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2", "alembic>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
